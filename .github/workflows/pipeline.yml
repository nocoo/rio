name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Worker (production)
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: trusted
      artifact-name: rio-dist
      artifact-path: dist
      wrangler-version: lockfile
      wrangler-config: dist/client/rio/wrangler.json
      environment: production
      concurrency-group: deploy-rio-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        RESP=$(curl -fsS https://rio.hexly.ai/api/live || echo '{}')
        ACTUAL=$(echo "$RESP" | jq -r .version)
        test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
