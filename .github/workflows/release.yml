name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful CI run ID to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: >-
        ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: trusted
      wrangler-version: lockfile
      build-command: bun run build
      environment: production
      concurrency-group: deploy-rio-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        RESP=$(curl -fsS https://rio.hexly.ai/api/live || echo '{}')
        ACTUAL=$(echo "$RESP" | jq -r .version)
        test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
